<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transformer LLM: text to next-token probabilities</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="models" aria-label="Model"></nav>

  <header>
    <h1>Transformer LLM: text to next-token probabilities</h1>
    <p id="model-line"></p>
    <div class="stepper">
      <button id="prev">◀ Prev</button>
      <span id="step-label"></span>
      <button id="next">Next ▶</button>
    </div>
  </header>

  <main>
    <div id="diagram"></div>
    <aside id="panel"></aside>
  </main>

  <!-- models.js: config data. app.js: template that builds the diagram and text from the selected model. -->
  <script src="models.js"></script>
  <script src="app.js"></script>
</body>
</html>
