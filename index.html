<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI-Anatomy: model × phase × lens</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="models" aria-label="Model"></nav>

  <header>
    <h1>AI-Anatomy</h1>
    <p id="model-line"></p>
    <div id="controls"></div>
    <div class="stepper" id="stepper">
      <button id="prev">◀ Prev</button>
      <span id="step-label"></span>
      <button id="next">Next ▶</button>
    </div>
  </header>

  <main>
    <div id="view"></div>
    <aside id="panel"></aside>
  </main>

  <!-- Data: hardware.js, models.js, techniques.js. Numbers: calc.js. Views: app.js. -->
  <script src="hardware.js"></script>
  <script src="models.js"></script>
  <script src="techniques.js"></script>
  <script src="calc.js"></script>
  <script src="app.js"></script>
